<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gloria Store</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2, h3 {
      margin-top: 0;
    }
    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cdd6e3;
      border-radius: 8px;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      cursor: pointer;
      background: #0f766e;
      color: white;
      border: none;
      font-weight: 700;
      transition: 0.2s ease;
    }
    button:hover {
      background: #115e59;
    }
    .secondary {
      background: #2563eb;
    }
    .secondary:hover {
      background: #1d4ed8;
    }
    .danger {
      background: #dc2626;
    }
    .danger:hover {
      background: #b91c1c;
    }
    .hidden {
      display: none !important;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      padding: 15px 20px;
      background: #0f172a;
      color: white;
      border-radius: 12px;
    }
    .topbar .user {
      font-weight: 700;
    }
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mini-btn {
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 6px;
    }
    .success {
      color: #166534;
      background: #dcfce7;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .error {
      color: #991b1b;
      background: #fee2e2;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="authSection">
      <div class="card">
        <h2>Gloria Store</h2>
        <div class="auth-grid">
          <div>
            <h3>Register</h3>
            <form id="registerForm">
              <div class="form-group">
                <label for="regName">Full Name</label>
                <input id="regName" type="text" required />
              </div>
              <div class="form-group">
                <label for="regEmail">Email</label>
                <input id="regEmail" type="email" required />
              </div>
              <div class="form-group">
                <label for="regPassword">Password</label>
                <input id="regPassword" type="password" required />
              </div>
              <button type="submit">Register</button>
            </form>
          </div>

          <div>
            <h3>Login</h3>
            <form id="loginForm">
              <div class="form-group">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" required />
              </div>
              <div class="form-group">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" required />
              </div>
              <button type="submit" class="secondary">Login</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="appSection" class="hidden">
      <div class="topbar">
        <h2>Gloria Dashboard</h2>
        <div class="user" id="userDisplay">User</div>
        <button type="button" class="danger" id="logoutBtn">Logout</button>
      </div>

      <div class="product-grid">
        <div class="card">
          <h3 id="formTitle">Add Product</h3>
          <div id="successMessage" class="success message"></div>
          <div id="errorMessage" class="error message"></div>

          <form id="productForm">
            <input id="productId" type="hidden" />

            <div class="form-group">
              <label for="productName">Product Name</label>
              <input id="productName" type="text" required />
            </div>

            <div class="form-group">
              <label for="productCategory">Category</label>
              <select id="productCategory" required>
                <option value="">Select category</option>
                <option value="Stationery">Stationery</option>
                <option value="Office">Office</option>
                <option value="School">School</option>
                <option value="Packaging">Packaging</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="productPrice">Price</label>
              <input id="productPrice" type="number" min="0" step="0.01" required />
            </div>

            <div class="form-group">
              <label for="productQty">Quantity</label>
              <input id="productQty" type="number" min="0" required />
            </div>

            <div class="form-group">
              <label for="productDescription">Description</label>
              <textarea id="productDescription" required></textarea>
            </div>

            <button type="submit" id="saveProductBtn">Save Product</button>
            <button type="button" class="secondary hidden" id="cancelEditBtn" style="margin-top: 10px;">Cancel</button>
          </form>
        </div>

        <div class="card">
          <h3>Products List</h3>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Description</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const USERS_KEY = "gloria_users";
    const PRODUCTS_KEY = "gloria_products";
    const SESSION_KEY = "gloria_session";

    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const userDisplay = document.getElementById("userDisplay");

    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");
    const productForm = document.getElementById("productForm");
    const productTableBody = document.getElementById("productTableBody");
    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");
    const formTitle = document.getElementById("formTitle");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function getUsers() {
      return JSON.parse(localStorage.getItem(USERS_KEY) || "[]");
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getProducts() {
      return JSON.parse(localStorage.getItem(PRODUCTS_KEY) || "[]");
    }

    function saveProducts(products) {
      localStorage.setItem(PRODUCTS_KEY, JSON.stringify(products));
    }

    function getCurrentUser() {
      return JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    }

    function setCurrentUser(user) {
      if (user) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    function showMessage(type, text) {
      const box = type === "success" ? successMessage : errorMessage;
      box.textContent = text;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 2500);
    }

    function showAuth() {
      authSection.classList.remove("hidden");
      appSection.classList.add("hidden");
    }

    function showApp(user) {
      authSection.classList.add("hidden");
      appSection.classList.remove("hidden");
      userDisplay.textContent = user.name || user.email;
      renderProducts();
    }

    function initializeAuth() {
      const user = getCurrentUser();
      if (user) {
        showApp(user);
      } else {
        showAuth();
      }
    }

    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = document.getElementById("regPassword").value.trim();

      if (!name || !email || !password) {
        showMessage("error", "Please fill in all fields.");
        return;
      }

      const users = getUsers();
      const exists = users.some(user => user.email === email);

      if (exists) {
        showMessage("error", "This email is already registered.");
        return;
      }

      const newUser = {
        id: Date.now(),
        name,
        email,
        password
      };

      users.push(newUser);
      saveUsers(users);
      registerForm.reset();
      showMessage("success", "Registration successful! Please login.");
    });

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value.trim();

      const users = getUsers();
      const foundUser = users.find(user => user.email === email && user.password === password);

      if (!foundUser) {
        showMessage("error", "Invalid email or password.");
        return;
      }

      setCurrentUser(foundUser);
      loginForm.reset();
      showApp(foundUser);
    });

    logoutBtn.addEventListener("click", function () {
      setCurrentUser(null);
      showAuth();
    });

    productForm.addEventListener("submit", function (e) {
      e.preventDefault();

      const id = document.getElementById("productId").value;
      const name = document.getElementById("productName").value.trim();
      const category = document.getElementById("productCategory").value;
      const price = Number(document.getElementById("productPrice").value);
      const qty = Number(document.getElementById("productQty").value);
      const description = document.getElementById("productDescription").value.trim();

      if (!name || !category || !price || !qty || !description) {
        showMessage("error", "Please fill in all product fields.");
        return;
      }

      const products = getProducts();

      if (id) {
        const index = products.findIndex(p => p.id == id);
        if (index !== -1) {
          products[index] = {
            ...products[index],
            name,
            category,
            price,
            quantity: qty,
            description
          };
          showMessage("success", "Product updated successfully.");
        }
      } else {
        products.push({
          id: Date.now(),
          name,
          category,
          price,
          quantity: qty,
          description
        });
        showMessage("success", "Product added successfully.");
      }

      saveProducts(products);
      productForm.reset();
      resetProductForm();
      renderProducts();
    });

    function renderProducts() {
      const products = getProducts();
      productTableBody.innerHTML = "";

      if (!products.length) {
        productTableBody.innerHTML = `
          <tr>
            <td colspan="6">No products available yet.</td>
          </tr>
        `;
        return;
      }

      products.forEach(product => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${product.name}</td>
          <td>${product.category}</td>
          <td>$${Number(product.price).toFixed(2)}</td>
          <td>${product.quantity}</td>
          <td>${product.description}</td>
          <td>
            <div class="actions">
              <button class="mini-btn secondary" data-action="edit" data-id="${product.id}">Edit</button>
              <button class="mini-btn danger" data-action="delete" data-id="${product.id}">Delete</button>
            </div>
          </td>
        `;

        productTableBody.appendChild(row);
      });
    }

    productTableBody.addEventListener("click", function (e) {
      const target = e.target;
      if (!target.dataset.action) return;

      const id = Number(target.dataset.id);
      const products = getProducts();

      if (target.dataset.action === "delete") {
        const filtered = products.filter(p => p.id !== id);
        saveProducts(filtered);
        renderProducts();
        showMessage("success", "Product deleted.");
      }

      if (target.dataset.action === "edit") {
        const product = products.find(p => p.id === id);
        if (!product) return;

        document.getElementById("productId").value = product.id;
        document.getElementById("productName").value = product.name;
        document.getElementById("productCategory").value = product.category;
        document.getElementById("productPrice").value = product.price;
        document.getElementById("productQty").value = product.quantity;
        document.getElementById("productDescription").value = product.description;

        formTitle.textContent = "Edit Product";
        cancelEditBtn.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    function resetProductForm() {
      document.getElementById("productId").value = "";
      formTitle.textContent = "Add Product";
      cancelEditBtn.classList.add("hidden");
    }

    cancelEditBtn.addEventListener("click", function () {
      productForm.reset();
      resetProductForm();
    });

    initializeAuth();
  </script>
</body>
</html>
